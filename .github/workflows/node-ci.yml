
name: Node.js CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build

  deploy:
    name: Deploy to WSL Ubuntu
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

     
      - name: Deploy and Start Application
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          set -e

          mkdir -p "$HOME/nodejs-app"
          cp -r dist "$HOME/nodejs-app/"
          cp package.json package-lock.json "$HOME/nodejs-app/"

          cd "$HOME/nodejs-app"
          npm ci --omit=dev

          if [ -f app.pid ]; then
            OLD_PID=$(cat app.pid)
            if kill -0 "$OLD_PID" 2>/dev/null; then
              kill "$OLD_PID"
              for i in {1..10}; do
                if ! kill -0 "$OLD_PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              if kill -0 "$OLD_PID" 2>/dev/null; then
                kill -9 "$OLD_PID"
              fi
            fi
            rm -f app.pid
          fi

          PORT=3000 APP_VERSION="$APP_VERSION" \
            nohup node dist/server.js > app.log 2>&1 < /dev/null &

          echo $! > app.pid

          for i in {1..15}; do
             if curl -fsS http://127.0.0.1:3000/health; then
              echo
              echo "Deployment successful!"
              exit 0
            fi
            sleep 2
          done

          cat app.log
          echo "Application health check failed"
          exit 1

