name: Node.js CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build

  deploy:
    name: Deploy to WSL Ubuntu
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

     
     
      - name: Deploy and Start Application
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          set -e

          APP_DIR="$HOME/nodejs-app"
          mkdir -p "$APP_DIR"

          cp -r dist "$APP_DIR/"
          cp package.json package-lock.json "$APP_DIR/"

          cd "$APP_DIR"
          npm ci --omit=dev

          # Stop the application tracked by the PID file.
          if [ -f app.pid ]; then
            OLD_PID=$(cat app.pid)

            if [[ "$OLD_PID" =~ ^[0-9]+$ ]] && kill -0 "$OLD_PID" 2>/dev/null; then
              kill "$OLD_PID" || true

              for i in {1..10}; do
                if ! kill -0 "$OLD_PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done

              if kill -0 "$OLD_PID" 2>/dev/null; then
                kill -9 "$OLD_PID" || true
              fi
            fi

            rm -f app.pid
          fi

          # Start the new application.
          PORT=3000 APP_VERSION="$APP_VERSION" \
            nohup node "$APP_DIR/dist/server.js" \
            > "$APP_DIR/app.log" 2>&1 < /dev/null &

          APP_PID=$!
          echo "$APP_PID" > "$APP_DIR/app.pid"

          # Verify the health endpoint.
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo
              echo "Deployment successful! Version: $APP_VERSION"
              exit 0
            fi
            sleep 2
          done

          cat "$APP_DIR/app.log"
          echo "Application health check failed"
          exit 1